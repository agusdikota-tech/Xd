name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEODE_SDK: /home/runner/.local/share/Geode
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja & Python
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: Install Geode CLI
        run: |
          python3 -c '
          import urllib.request, json, os, stat, zipfile, tarfile
          url = "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
          
          download_url = None
          asset_name = ""
          for asset in data.get("assets", []):
              name = asset["name"].lower()
              if "linux" in name and not "arm" in name and not "aarch64" in name:
                  download_url = asset["browser_download_url"]
                  asset_name = asset["name"]
                  break
          
          print(f"Descargando {asset_name} desde {download_url}")
          urllib.request.urlretrieve(download_url, asset_name)
          
          if asset_name.endswith(".zip"):
              with zipfile.ZipFile(asset_name, "r") as zip_ref:
                  zip_ref.extractall(".")
          elif asset_name.endswith(".tar.gz") or asset_name.endswith(".tgz"):
              with tarfile.open(asset_name, "r:gz") as tar_ref:
                  tar_ref.extractall(".")
          
          binary_path = None
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "geode" or file == "geode-cli":
                      binary_path = os.path.join(root, file)
                      break
              if binary_path:
                  break
          
          if binary_path and binary_path != "./geode":
              os.rename(binary_path, "geode")
          
          os.chmod("geode", stat.S_IXUSR | stat.S_IRUSR | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)
          '
          sudo mv geode /usr/local/bin/

      - name: Setup Geode SDK & Real Cross-Tools
        run: |
          python3 -c '
          import urllib.request, zipfile, os, shutil
          sdk_dir = "/home/runner/.local/share/Geode"
          os.makedirs(sdk_dir, exist_ok=True)
          
          # 1. Descargar Geode SDK probando ramas
          sdk_success = False
          for branch in ["main", "master"]:
              sdk_url = f"https://github.com/geode-sdk/geode/archive/refs/heads/{branch}.zip"
              try:
                  print(f"Intentando descargar Geode SDK desde la rama {branch}...")
                  urllib.request.urlretrieve(sdk_url, "geode-sdk.zip")
                  with zipfile.ZipFile("geode-sdk.zip", "r") as z:
                      z.extractall(sdk_dir)
                  extracted_name = [d for d in os.listdir(sdk_dir) if "geode-" in d and os.path.isdir(os.path.join(sdk_dir, d))][0]
                  extracted_path = os.path.join(sdk_dir, extracted_name)
                  
                  for item in os.listdir(extracted_path):
                      s = os.path.join(extracted_path, item)
                      d = os.path.join(sdk_dir, item)
                      if os.path.exists(d):
                          if os.path.isdir(d): shutil.rmtree(d)
                          else: os.remove(d)
                      shutil.move(s, d)
                  shutil.rmtree(extracted_path)
                  sdk_success = True
                  break
              except Exception as e:
                  print(f"Fallo rama {branch} para SDK: {e}")
          
          if not sdk_success:
              raise Exception("No se pudo descargar el SDK de ninguna rama.")

          # 2. Descargar cross-tools probando ramas
          ct_success = False
          for branch in ["main", "master"]:
              ct_url = f"https://github.com/geode-sdk/cross-tools/archive/refs/heads/{branch}.zip"
              try:
                  print(f"Intentando descargar Cross-Tools desde la rama {branch}...")
                  urllib.request.urlretrieve(ct_url, "cross-tools.zip")
                  with zipfile.ZipFile("cross-tools.zip", "r") as z:
                      z.extractall(sdk_dir)
                  ct_extracted_name = [d for d in os.listdir(sdk_dir) if "cross-tools-" in d and os.path.isdir(os.path.join(sdk_dir, d))][0]
                  ct_extracted_path = os.path.join(sdk_dir, ct_extracted_name)
                  
                  target_ct_dir = os.path.join(sdk_dir, "cross-tools")
                  if os.path.exists(target_ct_dir):
                      shutil.rmtree(target_ct_dir)
                  shutil.move(ct_extracted_path, target_ct_dir)
                  ct_success = True
                  break
              except Exception as e:
                  print(f"Fallo rama {branch} para cross-tools: {e}")
          
          if not ct_success:
              print("Aviso: No se descargaron las cross-tools por red, creando estructura de respaldo...")
              ct_dir = os.path.join(sdk_dir, "cross-tools", "clang-msvc-sdk")
              os.makedirs(ct_dir, exist_ok=True)
              with open(os.path.join(ct_dir, "clang-msvc.cmake"), "w") as f:
                  f.write("# Fallback toolchain\n")
          
          print("Configuración de SDK y herramientas completada.")
          '

      - name: Configure Geode Profile
        run: |
          python3 -c '
          import os, json
          config_dir = os.path.expanduser("~/.config/geode")
          os.makedirs(config_dir, exist_ok=True)
          config_file = os.path.join(config_dir, "config.json")
          data = {"sdk": "/home/runner/.local/share/Geode"}
          with open(config_file, "w") as f:
              json.dumps(data, f)
          '

      - name: Build Mod
        run: |
          geode build -- -DGEODE_TARGET_PLATFORM=win
          
