name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Geode CLI
        run: |
          curl -L -o geode.tar.gz https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.tar.gz || curl -L -o geode.tar.gz https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-ubuntu.tar.gz
          tar -xzf geode.tar.gz
          sudo chmod +x geode
          sudo mv geode /usr/local/bin/

      - name: Build Mod
        run: |
          geode package build
          
