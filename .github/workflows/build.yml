name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Geode CLI & Setup SDK
        run: |
          python -c "
          import urllib.request, json, os, zipfile, shutil

          print('--- Descargando e instalando Geode CLI ---')
          url = 'https://api.github.com/repos/geode-sdk/cli/releases/latest'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
          
          download_url = next(a['browser_download_url'] for a in data['assets'] if 'win' in a['name'].lower())
          urllib.request.urlretrieve(download_url, 'geode-cli.zip')
          
          os.makedirs('cli-bin', exist_ok=True)
          with zipfile.ZipFile('geode-cli.zip', 'r') as z:
              z.extractall('cli-bin')
          
          # Mover el ejecutable a una ruta accesible del sistema
          exe_path = None
          for root, dirs, files in os.walk('cli-bin'):
              for f in files:
                  if f.lower() == 'geode.exe':
                      exe_path = os.path.join(root, f)
                      break
            
          if exe_path:
              shutil.move(exe_path, 'geode.exe')
              print('Geode CLI instalado con éxito.')

          print('--- Configurando Geode SDK ---')
          sdk_dir = os.path.expanduser('~/.config/geode')
          os.makedirs(sdk_dir, exist_ok=True)
          
          # Descargar SDK de Geode
          sdk_url = 'https://github.com/geode-sdk/geode/archive/refs/heads/main.zip'
          urllib.request.urlretrieve(sdk_url, 'geode-sdk.zip')
          with zipfile.ZipFile('geode-sdk.zip', 'r') as z:
              z.extractall('sdk-temp')
          
          extracted_folder = os.path.join('sdk-temp', os.listdir('sdk-temp')[0])
          target_sdk = os.path.expanduser('~/AppData/Local/Geode/sdk') # o ruta estándar
          "

      - name: Build Mod for Windows
        run: |
          # Ejecutar la compilación nativa en Windows
          .\geode.exe build --platform windows
          
