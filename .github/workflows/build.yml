name: Build Mod (Android)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GEODE_SDK: /home/runner/.local/share/Geode
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Geode CLI & SDK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import urllib.request, json, os, zipfile, shutil
          token = os.environ.get("GH_TOKEN")
          url = "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
          
          download_url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower())
          urllib.request.urlretrieve(download_url, "geode-cli.zip")
          with zipfile.ZipFile("geode-cli.zip", "r") as z:
              z.extractall(".")
          
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f in ["geode", "geode-cli"]:
                      os.rename(os.path.join(root, f), "geode")
                      break
          os.chmod("geode", 0o755)

          # Descargar SDK
          sdk_dir = "/home/runner/.local/share/Geode"
          os.makedirs(sdk_dir, exist_ok=True)
          sdk_url = "https://github.com/geode-sdk/geode/archive/refs/heads/main.zip"
          urllib.request.urlretrieve(sdk_url, "geode-sdk.zip")
          with zipfile.ZipFile("geode-sdk.zip", "r") as z:
              z.extractall("sdk-temp")
          
          extracted_name = [d for d in os.listdir("sdk-temp") if "geode-" in d][0]
          extracted_path = os.path.join("sdk-temp", extracted_name)
          for item in os.listdir(extracted_path):
              s = os.path.join(extracted_path, item)
              d = os.path.join(sdk_dir, item)
              if os.path.exists(d):
                  if os.path.isdir(d): shutil.rmtree(d)
                  else: os.remove(d)
              shutil.move(s, d)
          shutil.rmtree("sdk-temp")
          EOF
          sudo mv geode /usr/local/bin/

      - name: Configure Geode Profile & Build
        run: |
          # Registrar el perfil de forma no interactiva creando el archivo config.json directamente
          mkdir -p ~/.config/geode
          echo '{"profiles": {"default": {"path": "'$PWD'", "sdk": "/home/runner/.local/share/Geode"}}, "active": "default"}' > ~/.config/geode/config.json
          
          # Instalar binarios y compilar directamente para android32
          geode sdk install-binaries
          geode build --platform android32

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-assist-android
          path: "build/*.geode"
          
