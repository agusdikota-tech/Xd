name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Geode CLI
        run: |
          VERSION=$(curl -s "https://api.github.com/repos/geode-sdk/cli/releases/latest" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -L -o geode-cli.zip "https://github.com/geode-sdk/cli/releases/download/$VERSION/geode-cli-linux.zip" || curl -L -o geode-cli.zip "https://github.com/geode-sdk/cli/releases/download/$VERSION/geode-cli-ubuntu.zip"
          unzip geode-cli.zip
          chmod +x geode
          sudo mv geode /usr/local/bin/

      - name: Build Mod
        run: |
          geode package build
          
