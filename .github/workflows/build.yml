name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Geode SDK
        uses: geode-sdk/install-geode-cli@main

      - name: Build for Android and PC
        run: |
          geode package build
          
