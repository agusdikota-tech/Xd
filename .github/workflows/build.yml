name: Build Mod

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Ninja & Python
        run: sudo apt-get update && sudo apt-get install -y ninja-build python3

      - name: Install Geode CLI
        run: |
          python3 -c '
          import urllib.request, json, os, stat, zipfile, tarfile
          url = "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
          
          download_url = None
          asset_name = ""
          for asset in data.get("assets", []):
              name = asset["name"].lower()
              if "linux" in name and not "arm" in name and not "aarch64" in name:
                  download_url = asset["browser_download_url"]
                  asset_name = asset["name"]
                  break
          
          print(f"Descargando {asset_name} desde {download_url}")
          urllib.request.urlretrieve(download_url, asset_name)
          
          if asset_name.endswith(".zip"):
              with zipfile.ZipFile(asset_name, "r") as zip_ref:
                  zip_ref.extractall(".")
          elif asset_name.endswith(".tar.gz") or asset_name.endswith(".tgz"):
              with tarfile.open(asset_name, "r:gz") as tar_ref:
                  tar_ref.extractall(".")
          
          binary_path = None
          for root, dirs, files in os.walk("."):
              for file in files:
                  if file == "geode" or file == "geode-cli":
                      binary_path = os.path.join(root, file)
                      break
              if binary_path:
                  break
          
          if binary_path and binary_path != "./geode":
              os.rename(binary_path, "geode")
          
          os.chmod("geode", stat.S_IXUSR | stat.S_IRUSR | stat.S_IXGRP | stat.S_IROTH | stat.S_IXOTH)
          '
          sudo mv geode /usr/local/bin/

      - name: Setup Geode Cross-Tools
        run: |
          python3 -c '
          import urllib.request, zipfile, os, shutil
          os.makedirs("/home/runner/.local/share/Geode", exist_ok=True)
          target_dir = "/home/runner/.local/share/Geode/cross-tools"
          if os.path.exists(target_dir):
              shutil.rmtree(target_dir)
          
          success = False
          for branch in ["main", "master"]:
              url = f"https://github.com/geode-sdk/cross-tools/archive/refs/heads/{branch}.zip"
              zip_path = f"cross-tools-{branch}.zip"
              try:
                  print(f"Intentando descargar cross-tools desde la rama {branch}...")
                  urllib.request.urlretrieve(url, zip_path)
                  with zipfile.ZipFile(zip_path, "r") as z:
                      z.extractall("/home/runner/.local/share/Geode")
                  extracted_name = [d for d in os.listdir("/home/runner/.local/share/Geode") if "cross-tools" in d and d != "cross-tools"][0]
                  os.rename(os.path.join("/home/runner/.local/share/Geode", extracted_name), target_dir)
                  success = True
                  print("¡Cross-tools descargadas y configuradas con éxito!")
                  break
              except Exception as e:
                  print(f"Fallo con la rama {branch}: {e}")
          
          if not success:
              raise Exception("No se pudo descargar cross-tools de ninguna rama.")
          '

      - name: Build Mod
        run: |
          geode build
          
