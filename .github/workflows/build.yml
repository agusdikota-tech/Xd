name: Build Geode Mod (Android 32 & 64-bit)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: armeabi-v7a
            platform: android-23
            name: android32
          - abi: arm64-v8a
            platform: android-24
            name: android64

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Geode SDK
        run: |
          git clone --branch v5.11.2 --depth 1 https://github.com/geode-sdk/geode.git $HOME/.local/share/Geode

      - name: Download & Setup Android NDK r28
        run: |
          echo "Descargando NDK r28..."
          curl -L https://dl.google.com/android/repository/android-ndk-r28-linux.zip -o ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r28" >> $GITHUB_ENV

      - name: Configure CMake (${{ matrix.name }})
        run: |
          cmake -B build_${{ matrix.name }} \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=${{ matrix.platform }} \
            -DCMAKE_BUILD_TYPE=Release
        env:
          GEODE_SDK: /home/runner/.local/share/Geode

      - name: Build Mod (${{ matrix.name }})
        run: cmake --build build_${{ matrix.name }} --config Release

      - name: Upload Mod Artifact (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: frame-assist-${{ matrix.name }}
          path: "build_${{ matrix.name }}/*.geode"
          
