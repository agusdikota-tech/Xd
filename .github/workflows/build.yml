name: Build Mod (Android)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Geode CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import urllib.request, json, os, stat, zipfile
          token = os.environ.get("GH_TOKEN")
          url = "https://api.github.com/repos/geode-sdk/cli/releases/latest"
          headers = {"User-Agent": "Mozilla/5.0"}
          if token:
              headers["Authorization"] = f"Bearer {token}"
          
          req = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())
          
          download_url = next(a["browser_download_url"] for a in data["assets"] if "linux" in a["name"].lower())
          urllib.request.urlretrieve(download_url, "geode-cli.zip")
          with zipfile.ZipFile("geode-cli.zip", "r") as z:
              z.extractall(".")
          
          for root, dirs, files in os.walk("."):
              for f in files:
                  if f in ["geode", "geode-cli"]:
                      os.rename(os.path.join(root, f), "geode")
                      break
          os.chmod("geode", 0o755)
          '
          sudo mv geode /usr/local/bin/

      - name: Build Mod for Android
        run: |
          geode build --platform android32
          
