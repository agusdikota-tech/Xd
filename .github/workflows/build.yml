name: Build Geode Mod (Android)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Geode CLI
        uses: geode-sdk/cli-setup@main

      - name: Setup Android NDK
        uses: nsetup/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install Geode SDK & Build
        run: |
          geode sdk install $HOME/geode-sdk --version 5.11.2
          geode profile add default $HOME/geode-sdk
          geode build --platform android32 --config Release

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-assist-android
          path: "*.geode"
          
