name: Build Geode Mod (Android)

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Android NDK r25c
        run: |
          echo "Descargando NDK r25c..."
          curl -L https://dl.google.com/android/repository/android-ndk-r25c-linux.zip -o ndk.zip
          unzip -q ndk.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Install Geode CLI & Build
        run: |
          echo "Instalando Geode CLI..."
          mkdir -p $HOME/.geode/bin
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux -o $HOME/.geode/bin/geode
          chmod +x $HOME/.geode/bin/geode
          export PATH="$HOME/.geode/bin:$PATH"
          
          # Instalar SDK y compilar
          geode sdk install $HOME/geode-sdk --version 5.11.2
          geode profile add default $HOME/geode-sdk
          geode build --platform android32 --config Release

      - name: Upload Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-assist-android
          path: "*.geode"
          
